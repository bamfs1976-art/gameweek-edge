# Euro Matchdayedge — Netlify configuration.
#
# This is a SECOND Netlify site built from the same repository as Gameweek
# Edge. In the Netlify UI, set that site's **base directory** to `ucl` —
# Netlify then reads this file instead of the root one, and the two sites
# stop fighting over publish directories.
#
#   Site 1  Gameweek Edge   base: (repo root)  →  /netlify.toml   → www/
#   Site 2  Euro Matchdayedge   base: ucl          →  this file       → ucl/dist/
#
# The build reaches up to ../index.html to lift the shared model engine out of
# Gameweek Edge, which is why this must stay in the same repo rather than
# becoming a fork. Netlify clones the whole repository, so `..` is present
# even with the base directory set.

[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# ── Security headers ─────────────────────────────────────────────
# Mirrors the Gameweek Edge policy. The app is a single page with inline
# script and style, so those need 'unsafe-inline'; everything else is
# locked to the origins actually used. No third-party image host is
# allowed — Euro Matchdayedge ships without competition imagery (see BRAND).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://knodunjnsxelmpziupwk.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# UEFA Champions League Fantasy data, normalised into the FPL vocabulary the
# shared engine speaks. See functions/ucl.js.
[[redirects]]
  from = "/api/ucl/*"
  to = "/.netlify/functions/ucl/:splat"
  status = 200
  force = true
