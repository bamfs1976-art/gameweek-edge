# Gameweek Edge — Netlify configuration
# Single-page static site with two serverless functions:
#   /.netlify/functions/fpl  — whitelisted proxy to the official FPL API
#   /.netlify/functions/ai   — typed proxy to the Anthropic API (Phase 12)
# Both functions are auto-discovered under netlify/functions/.

[build]
  publish    = "."
  functions  = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty-path alias so the client can call /api/<path> for FPL data.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/fpl?path=:splat"
  status = 200

# Security headers applied to every response.
# CSP allows: inline style/script (single-file HTML), Google Fonts, FPL kit imagery, and same-origin fetches (proxy is same-origin).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fantasy.premierleague.com https://resources.premierleague.com; connect-src 'self' https://knodunjnsxelmpziupwk.supabase.co wss://knodunjnsxelmpziupwk.supabase.co https://esm.sh; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
