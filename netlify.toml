# Gameweek Edge — Netlify configuration
# The web app is the single-file index.html at the repo root; the FPL
# proxy is a serverless function. (The iOS app reuses the same function
# via an absolute URL — see GE_CONFIG in index.html.)

[build]
  command = "npm run build:web"
  publish = "www"
  functions = "netlify/functions"

[build.environment]
  # The Supabase project URL is public client configuration — it ships in
  # index.html by design (Supabase's model: RLS + anon key in the client),
  # so the secrets scanner must not fail the build on it. Real secrets
  # (service-role key, Stripe/Anthropic keys, VAPID private key) are still
  # scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

# The prediction logger runs hourly. It extracts the shipping model from
# index.html at runtime, so the file must be bundled with the function.
[functions."log-predictions"]
  schedule = "@hourly"
  included_files = ["index.html"]

# ── Security headers ─────────────────────────────────────────────
# The app is a single-file page with inline scripts/styles and inline
# event handlers, so script-src/style-src need 'unsafe-inline'. The
# CSP is built from the origins the app actually uses:
#   connect-src : own /api/* functions, Supabase (auth + REST),
#                 plsimulation.netlify.app (shared model.json)
#   img-src     : self + data: + resources.premierleague.com
#                 (club crests, player photos)
#   style/font  : Google Fonts (stylesheet + font files)
# worker-src 'self' keeps the service worker (and push) working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://resources.premierleague.com; connect-src 'self' https://knodunjnsxelmpziupwk.supabase.co https://plsimulation.netlify.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Clean URL for the marketing landing page (share gameweekedge.co.uk/welcome).
[[redirects]]
  from = "/welcome"
  to = "/landing.html"
  status = 200

# Clean URL for the model methodology page (linked from the trust strip).
[[redirects]]
  from = "/methodology"
  to = "/?panel=methodology"
  status = 301

# Clean URL for the design-system reference.
[[redirects]]
  from = "/design"
  to = "/?panel=design"
  status = 301

# football-data.org proxy: referees and cross-competition (midweek) fixtures,
# neither of which the FPL feed carries. The API key stays in the function's
# environment (FOOTBALL_DATA_KEY) and never reaches the browser — which is also
# why the CSP's connect-src does not need a new host: the app only ever talks
# to /api/*, same origin.
[[redirects]]
  from = "/api/football-data/*"
  to = "/.netlify/functions/football-data/:splat"
  status = 200

# Route the app's API calls to the proxy function, preserving the path.
[[redirects]]
  from = "/api/fpl/*"
  to = "/.netlify/functions/fpl/:splat"
  status = 200
  force = true

# Fantasy EFL ships at /fantasy-efl/ as five ordinary static pages
# (efl/app/ → www/fantasy-efl/, copied by scripts/build-web.mjs), so it needs
# no redirect: Netlify's pretty URLs already serve /fantasy-efl/fixtures from
# fixtures/index.html. It needs no CSP change either — everything it loads is
# same-origin apart from Google Fonts, which is already allowed, and its only
# data request goes to /api/efl/* below.
#
# The official Fantasy EFL feed. Three documents — squads, players, rounds —
# that need no API key and no account, proxied so the browser only ever talks
# to this origin: connect-src in the CSP above is 'self' and nothing else, and
# the function's cache TTLs are what keep us a polite client of somebody's
# front end rather than a load on it. See netlify/functions/efl.js.
#
# The app reads this feed by default. fantasy.efl.com was unreachable from the
# machine the provider was written on, so a shape change is guarded rather than
# assumed away: /api/efl/health reports whether each document is the shape the
# app expects, a mismatch produces a named error instead of wrong numbers, and
# ?provider=sample on any Fantasy EFL URL falls back to the clearly-labelled
# generated dataset without a deploy.
[[redirects]]
  from = "/api/efl/*"
  to = "/.netlify/functions/efl/:splat"
  status = 200
  force = true

# Euro Matchday Edge (/euro/) and its UCL proxy (/api/ucl/*) were removed.
# Those URLs were public and are in browser histories, home screens and
# search indexes, so they redirect permanently to the front door rather than
# 404ing at someone who bookmarked them.
[[redirects]]
  from = "/euro/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/api/ucl/*"
  to = "/"
  status = 301
  force = true

# AI features (Claude) — scout report, chat, transfers, digest, etc.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# Public "Ask the model" (right-rail stub — canned, no auth).
[[redirects]]
  from = "/api/public/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true

# Same-origin image proxy for the Social Studio canvas (see img.js — a
# cross-origin image would taint the canvas and break the PNG export).
[[redirects]]
  from = "/api/img"
  to = "/.netlify/functions/img"
  status = 200
  force = true

# First-party analytics (fire-and-forget event pings).
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

# Owner analytics. Reads the event table, so the function verifies the
# caller's Supabase token against the owner allowlist before answering.
[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

# Stripe billing.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/portal"
  to = "/.netlify/functions/portal"
  status = 200
  force = true

# Web Push.
[[redirects]]
  from = "/api/push-key"
  to = "/.netlify/functions/push-key"
  status = 200
  force = true

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/push-unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/model-calibration"
  to = "/.netlify/functions/model-calibration"
  status = 200
  force = true

[[redirects]]
  from = "/api/predictions-health"
  to = "/.netlify/functions/predictions-health"
  status = 200
  force = true

# FPL Core Insights advanced stats (goalkeeper goals-prevented, open-play xG,
# finishing quality) merged onto players client-side.
[[redirects]]
  from = "/api/core-insights"
  to = "/.netlify/functions/core-insights-data"
  status = 200
  force = true

# Midweek European and cup fixtures by FPL gameweek — the congestion the
# official FPL API cannot see, used by the minutes model and Rotation Risk.
[[redirects]]
  from = "/api/euro-fixtures"
  to = "/.netlify/functions/euro-fixtures"
  status = 200
  force = true

# Club Elo keyed by FPL team id — a club-specific prior for the match model
# where we have no offline-fitted one.
[[redirects]]
  from = "/api/team-elo"
  to = "/.netlify/functions/team-elo"
  status = 200
  force = true

# Ten seasons of reduced FPL history (data/fpl-history.json, built offline by
# scripts/history/build-history.mjs from the open vaastav dataset). A static
# file rather than a function — it changes once a season, not once a request.
# Served under /api/ so the app has exactly one base URL to configure, which
# is what makes the packaged iOS build work without a second setting.
[[redirects]]
  from = "/api/history"
  to = "/data/fpl-history.json"
  status = 200
  force = true

# The ten-season walk-forward backtest result, published so the Model
# Accountability panel can show every season rather than a chosen one.
[[redirects]]
  from = "/api/backtest-history"
  to = "/data/backtest-history.json"
  status = 200
  force = true

# History is immutable between rebuilds, so cache it hard. stale-while-
# revalidate means a new season's data rolls out without anyone waiting on it.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Scheduled push sender (hourly).
[functions."push-cron"]
  schedule = "@hourly"

# FPL Core Insights aggregator — pulls the open advanced-stats dataset and
# refreshes public.gwedge_core_insights twice daily, ~1h after upstream.
[functions."core-insights"]
  schedule = "30 6,17 * * *"
