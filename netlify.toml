# Gameweek Edge — Netlify configuration
# The web app is the single-file index.html at the repo root; the FPL
# proxy is a serverless function. (The iOS app reuses the same function
# via an absolute URL — see GE_CONFIG in index.html.)

[build]
  command = "npm run build:web"
  publish = "www"
  functions = "netlify/functions"

[build.environment]
  # The Supabase project URL is public client configuration — it ships in
  # index.html by design (Supabase's model: RLS + anon key in the client),
  # so the secrets scanner must not fail the build on it. Real secrets
  # (service-role key, Stripe/Anthropic keys, VAPID private key) are still
  # scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

# The prediction logger runs hourly. It extracts the shipping model from
# index.html at runtime, so the file must be bundled with the function.
[functions."log-predictions"]
  schedule = "@hourly"
  included_files = ["index.html"]

# ── Security headers ─────────────────────────────────────────────
# The app is a single-file page with inline scripts/styles and inline
# event handlers, so script-src/style-src need 'unsafe-inline'. The
# CSP is built from the origins the app actually uses:
#   connect-src : own /api/* functions, Supabase (auth + REST),
#                 plsimulation.netlify.app (shared model.json)
#   img-src     : self + data: + resources.premierleague.com
#                 (club crests, player photos)
#   style/font  : Google Fonts (stylesheet + font files)
# worker-src 'self' keeps the service worker (and push) working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://resources.premierleague.com; connect-src 'self' https://knodunjnsxelmpziupwk.supabase.co https://plsimulation.netlify.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Clean URL for the marketing landing page (share gameweekedge.co.uk/welcome).
[[redirects]]
  from = "/welcome"
  to = "/landing.html"
  status = 200

# Clean URL for the model methodology page (linked from the trust strip).
[[redirects]]
  from = "/methodology"
  to = "/?panel=methodology"
  status = 301

# Clean URL for the design-system reference.
[[redirects]]
  from = "/design"
  to = "/?panel=design"
  status = 301

# Route the app's API calls to the proxy function, preserving the path.
[[redirects]]
  from = "/api/fpl/*"
  to = "/.netlify/functions/fpl/:splat"
  status = 200
  force = true

# AI features (Claude) — scout report, chat, transfers, digest, etc.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# Public "Ask the model" (right-rail stub — canned, no auth).
[[redirects]]
  from = "/api/public/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true

# Same-origin image proxy for the Social Studio canvas (see img.js — a
# cross-origin image would taint the canvas and break the PNG export).
[[redirects]]
  from = "/api/img"
  to = "/.netlify/functions/img"
  status = 200
  force = true

# First-party analytics (fire-and-forget event pings).
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

# Stripe billing.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/portal"
  to = "/.netlify/functions/portal"
  status = 200
  force = true

# Web Push.
[[redirects]]
  from = "/api/push-key"
  to = "/.netlify/functions/push-key"
  status = 200
  force = true

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/push-unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/model-calibration"
  to = "/.netlify/functions/model-calibration"
  status = 200
  force = true

[[redirects]]
  from = "/api/predictions-health"
  to = "/.netlify/functions/predictions-health"
  status = 200
  force = true

# FPL Core Insights advanced stats (goalkeeper goals-prevented, open-play xG,
# finishing quality) merged onto players client-side.
[[redirects]]
  from = "/api/core-insights"
  to = "/.netlify/functions/core-insights-data"
  status = 200
  force = true

# Midweek European and cup fixtures by FPL gameweek — the congestion the
# official FPL API cannot see, used by the minutes model and Rotation Risk.
[[redirects]]
  from = "/api/euro-fixtures"
  to = "/.netlify/functions/euro-fixtures"
  status = 200
  force = true

# Club Elo keyed by FPL team id — a club-specific prior for the match model
# where we have no offline-fitted one.
[[redirects]]
  from = "/api/team-elo"
  to = "/.netlify/functions/team-elo"
  status = 200
  force = true

# Scheduled push sender (hourly).
[functions."push-cron"]
  schedule = "@hourly"

# FPL Core Insights aggregator — pulls the open advanced-stats dataset and
# refreshes public.gwedge_core_insights twice daily, ~1h after upstream.
[functions."core-insights"]
  schedule = "30 6,17 * * *"
