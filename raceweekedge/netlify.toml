# RaceWeek Edge — Netlify configuration.
# Deploy this folder as its own Netlify site (base = raceweekedge).

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/f1/*"
  to = "/.netlify/functions/f1/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
