name: Squad nationality check

# Answers one question: does football-data.org's free tier actually FILL
# `nationality` on /teams/{id}'s squad, on the plan this site holds?
#
# It matters because FPL carries no nationality field at all, and the
# alternative source for it (Pulselive's /players) is an undocumented site API
# whose terms say nothing about third-party use. If football-data fills this,
# that licensing question never has to be asked. See docs/data-sources.md.
#
# It is a workflow because the sandbox this project is developed in cannot
# reach either host — measured 21 Aug 2026, both api.football-data.org and
# gameweekedge.co.uk answer `000`, the egress proxy refusing the CONNECT. A
# runner has network.
#
# NO SECRETS ARE USED OR NEEDED. The probe calls our own deployed site, and
# FOOTBALL_DATA_KEY stays in the Netlify function's environment where it
# belongs. Copying it into GitHub to run this would be a worse trade than not
# knowing the answer.
#
# Manual only. This is a question asked once and written down, not a monitor —
# and the free tier is ~10 requests a minute for the entire site, so a
# scheduled run would be spending a real budget to re-learn a settled fact.
#
# A red run means the probe COULD NOT MEASURE — the proxy refused, or no squad
# came back to look in. It does not mean nationality is unavailable. The two
# are different findings and the script is built to keep them apart.

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Site to probe (defaults to production)'
        required: false
        default: 'https://gameweekedge.co.uk'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove the probe's gates still fire
        # Runs first, deliberately. A probe whose gates have not been
        # exercised cannot be trusted to tell "no" from "could not ask", and
        # that distinction is the only reason to read its output.
        run: node dev/test-squad-probe.mjs
      - name: Ask whether nationality is populated
        env:
          GWE_BASE: ${{ inputs.base }}
        run: node dev/probe-squad-nationality.mjs
