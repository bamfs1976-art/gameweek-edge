name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the workflows that actually run this code (daily-content,
          # club-threads). Testing on 20 while the scheduled jobs run 22 is
          # the same class of gap as testing against a node_modules the CI
          # runner never has.
          node-version: 22
          cache: npm

      # The suite USED to need no install, and that was worth having. It
      # stopped being true when the palette moved to Fuse.js: dev/test-core.mjs
      # imports the real matcher rather than a mock, because the whole point of
      # the change was typo tolerance and a mock would tolerate whatever it was
      # told to. That import made CI fail with ERR_MODULE_NOT_FOUND on a
      # checkout with no node_modules.
      #
      # --omit=dev is the narrow fix. npm test needs exactly one package,
      # fuse.js, and it is a runtime dependency; the heavy devDependencies
      # (playwright, sharp, ffmpeg-static) stay uninstalled, so this costs
      # seconds rather than minutes.
      #
      # It also buys something the old arrangement could not: CI now proves
      # `npm ci` resolves from the lockfile on a clean machine, which is the
      # exact failure the declared-dependency guard below was written after.
      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Syntax-check serverless functions
        run: |
          for f in netlify/functions/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check the app's inline script
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html', 'utf8');
            const m = src.match(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/);
            fs.writeFileSync('/tmp/ge-app.js', m[1]);
          "
          node --check /tmp/ge-app.js

      # The whole suite, not a hand-picked three — the twelve suites that
      # were once not listed here (content, engine, social, chip plan,
      # analytics and the rest) went unrun on every push. It reads
      # index.html from the checkout and needs only the runtime
      # dependencies installed above.
      - name: Test suite
        run: npm test

      - name: Shell integrity guard
        run: node scripts/check-shell.mjs

      # The vendored rotation signal, proved against its source rather than
      # trusted. Offline (--check) is part of `npm test` via check-rotation;
      # this step adds the network half: re-fetch from pl-bookings and fail if
      # the pinned copy has drifted. Split out because it is the one check here
      # that can fail for a reason outside this repo, and that deserves its own
      # red light rather than being buried in the suite.
      - name: Vendored rotation model matches its source
        run: node scripts/vendor-rotation.mjs --check --remote

      # The card-ban ladder, same arrangement: `npm test` proves the committed
      # slices match their recorded hashes and still say 5/10/15 gated at 19
      # and 32; this step re-fetches core.js, suspension.js and pl_data.js at
      # the pinned commit and fails if the vendored bytes have drifted.
      - name: Vendored suspension rule matches its source
        run: node scripts/vendor-suspension.mjs --check --remote

      # The share renderer and saver, vendored verbatim from the same desk.
      - name: Vendored share renderer matches its source
        run: node scripts/vendor-share.mjs --check --remote

      # The share cards: the three adapters draw the XI, the gameweek, the
      # wordmark and the URL, no card carries betting language, and nothing
      # saves through a bare anchor (dead on iOS). Also in `npm test`.
      - name: Share cards say what the app says
        run: node scripts/check-share.mjs

      # Same split, same reason, for the vendored FPL OpenAPI spec. `npm test`
      # already proves the committed copy is intact and parses; what it cannot
      # prove offline is that the pin still describes something real. This
      # re-fetches from mcclowes/fpl-oas and fails only if the PINNED COMMIT
      # has stopped serving the bytes we recorded — a force-push or a rewritten
      # history under a SHA we treat as immutable, which would quietly turn the
      # witness in dev/test-fpl-contract.mjs into a different document.
      #
      # Upstream moving ON from the pin is NOT a failure and does not turn this
      # red: a third-party spec advancing is normal, adopting it is a decision
      # to make deliberately by re-running the vendor script and reading the
      # diff, and a check that goes red every time somebody else commits is one
      # that gets ignored. The run says so in its log instead.
      - name: Vendored FPL spec still matches its pinned source
        run: node scripts/vendor-fpl-spec.mjs --check --remote

      # The briefing checker itself needs the live FPL API, which CI does not
      # get. What CI CAN guard is that the shipped briefing still parses into
      # the shape the checker expects — because a document that has drifted out
      # of that shape produces a thin, clean-looking report rather than an
      # error, and thin-and-clean is the result nobody questions.
      - name: Briefing parses into checkable claims
        run: node dev/test-briefing.mjs

      # Catches the class of bug that broke Daily Content for four days: a
      # script importing a package that is installed locally but declared
      # nowhere, so it works on the machine it was written on and dies under
      # `npm ci`. It reads package.json and never node_modules, so installing
      # above cannot mask anything from it — and it stays last so a
      # declaration added to satisfy the installer still has to be real.
      - name: Declared-dependency guard
        run: node scripts/check-deps.mjs
