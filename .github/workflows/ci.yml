name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check serverless functions
        run: |
          for f in netlify/functions/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check the app's inline script
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html', 'utf8');
            const m = src.match(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/);
            fs.writeFileSync('/tmp/ge-app.js', m[1]);
          "
          node --check /tmp/ge-app.js

      - name: Core model unit tests
        run: node dev/test-core.mjs

      - name: Prediction logger core test
        run: node dev/test-predictions.mjs

      - name: Shell integrity guard
        run: node scripts/check-shell.mjs
