name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the workflows that actually run this code (daily-content,
          # club-threads). Testing on 20 while the scheduled jobs run 22 is
          # the same class of gap as testing against a node_modules the CI
          # runner never has.
          node-version: 22
          cache: npm

      # The suite USED to need no install, and that was worth having. It
      # stopped being true when the palette moved to Fuse.js: dev/test-core.mjs
      # imports the real matcher rather than a mock, because the whole point of
      # the change was typo tolerance and a mock would tolerate whatever it was
      # told to. That import made CI fail with ERR_MODULE_NOT_FOUND on a
      # checkout with no node_modules.
      #
      # --omit=dev is the narrow fix. npm test needs exactly one package,
      # fuse.js, and it is a runtime dependency; the heavy devDependencies
      # (playwright, sharp, ffmpeg-static) stay uninstalled, so this costs
      # seconds rather than minutes.
      #
      # It also buys something the old arrangement could not: CI now proves
      # `npm ci` resolves from the lockfile on a clean machine, which is the
      # exact failure the declared-dependency guard below was written after.
      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Syntax-check serverless functions
        run: |
          for f in netlify/functions/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check the app's inline script
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html', 'utf8');
            const m = src.match(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/);
            fs.writeFileSync('/tmp/ge-app.js', m[1]);
          "
          node --check /tmp/ge-app.js

      # The whole suite, not a hand-picked three — the twelve suites that
      # were once not listed here (content, engine, social, chip plan,
      # analytics and the rest) went unrun on every push. It reads
      # index.html from the checkout and needs only the runtime
      # dependencies installed above.
      - name: Test suite
        run: npm test

      - name: Shell integrity guard
        run: node scripts/check-shell.mjs

      # The briefing checker itself needs the live FPL API, which CI does not
      # get. What CI CAN guard is that the shipped briefing still parses into
      # the shape the checker expects — because a document that has drifted out
      # of that shape produces a thin, clean-looking report rather than an
      # error, and thin-and-clean is the result nobody questions.
      - name: Briefing parses into checkable claims
        run: node dev/test-briefing.mjs

      # Catches the class of bug that broke Daily Content for four days: a
      # script importing a package that is installed locally but declared
      # nowhere, so it works on the machine it was written on and dies under
      # `npm ci`. It reads package.json and never node_modules, so installing
      # above cannot mask anything from it — and it stays last so a
      # declaration added to satisfy the installer still has to be real.
      - name: Declared-dependency guard
        run: node scripts/check-deps.mjs
