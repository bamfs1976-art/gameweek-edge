name: Club Threads

# Generates the pre-season club preview threads — one per club, six posts
# each, every asset graded on returns, minutes and fixtures.
#
# Manual only, unlike the daily card. These are a pre-season series and a
# club's picture changes when the squad or the fixture list does, not on a
# timetable; running it weekly would publish twenty near-identical threads.
#
# Like the daily card it publishes for review and posts nowhere itself. The
# grades name real players and carry a recommendation — that is precisely the
# output that should not go out unread.

on:
  workflow_dispatch:
    inputs:
      club:
        description: 'Club short name (ARS, MCI …), or leave blank for all 20'
        type: string
        default: ''
      defcon:
        description: 'Also print the league defensive-contribution distribution'
        type: boolean
        default: false
      signings:
        description: 'Also print the raw team_join_date values, to check signing detection'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The nested sharp that @capacitor/assets pins downloads its native
      # library from GitHub Releases at install time, and one 504 from that
      # download failed run 43 before a single content script ran. A short
      # retry with backoff turns a transient fetch error back into a
      # working install; a genuine breakage still fails after the last try.
      - name: Install dependencies
        run: |
          for i in 1 2 3 4; do
            npm ci && exit 0
            echo "npm ci failed, retrying in $((2 ** i))s"
            sleep $((2 ** i))
          done
          exit 1

      - name: Generate
        run: |
          EXTRA=""
          if [ "${{ inputs.defcon }}" = "true" ]; then EXTRA="$EXTRA --defcon"; fi
          if [ "${{ inputs.signings }}" = "true" ]; then EXTRA="$EXTRA --signings"; fi
          if [ -n "${{ inputs.club }}" ]; then
            node scripts/content/club-thread.mjs --club "${{ inputs.club }}" $EXTRA
          else
            node scripts/content/club-thread.mjs --all $EXTRA
          fi

      - name: Publish for review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: threads-${{ github.run_number }}
          name: "Club threads${{ inputs.club && format(' — {0}', inputs.club) || ' — all clubs' }}"
          files: scripts/content/threads/*
