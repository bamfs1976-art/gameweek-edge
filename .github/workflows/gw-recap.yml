name: Gameweek Recap

# Renders a 1080x1080 MP4 recap after each gameweek settles and publishes
# it as a GitHub Release (recap-gw{n}) for you to download and post to X.
# The release doubles as the idempotency marker, so this is safe to re-run.

on:
  schedule:
    - cron: '0 9 * * 2' # Tuesdays 09:00 UTC — gameweeks are settled by then
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write # publish releases with the video attached

concurrency:
  group: gw-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data for the latest finished gameweek
        id: data
        run: node scripts/recap/fetch-data.mjs

      - name: Decide whether to render
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GW="${{ steps.data.outputs.gw }}"
          if [ -z "$GW" ] || [ "$GW" = "none" ]; then
            echo "No finished gameweek to render."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "recap-gw$GW" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "recap-gw$GW already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm i playwright --no-save
          npx playwright install --with-deps chromium

      - name: Render the recap video
        if: steps.gate.outputs.skip == 'false'
        run: node scripts/recap/render.mjs

      - name: Publish release
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GW="${{ steps.data.outputs.gw }}"
          gh release create "recap-gw$GW" \
            "scripts/recap/out/recap-gw$GW.mp4" \
            -R "$GITHUB_REPOSITORY" \
            --title "Gameweek $GW Recap" \
            --notes "Auto-generated 1080x1080 recap from the official FPL data. Download the MP4 and post to X. Independent — not affiliated with the Premier League."
