name: Budget Rotation Video

# Renders the 1080x1080 "budget rotation" MP4 — the exactly-solved cheapest
# way to cover one squad slot across the opening run — and publishes it as a
# GitHub Release for you to download and post.
#
# Manual only, unlike the weekly recap. A rotation plan changes when the
# fixture picture changes, not on a timetable, so publishing one every week
# would put out near-identical videos. Run it when the plan is worth showing:
# pre-season, after a fixture reshuffle, or when the chain shifts.

on:
  workflow_dispatch:
    inputs:
      pos:
        description: 'Position to rotate (1 GKP, 2 DEF, 3 MID)'
        type: choice
        options: ['2', '1', '3']
        default: '2'
      max:
        description: 'Max price in tenths of £m (50 = £5.0m)'
        type: string
        default: '50'
      weeks:
        description: 'Gameweeks to cover'
        type: string
        default: '10'
      tag:
        description: 'Release tag suffix (e.g. gw1) — reused tags are replaced'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: rotation-video
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Solve the rotation
        id: data
        run: |
          node scripts/recap/fetch-rotation.mjs \
            --pos "${{ github.event.inputs.pos }}" \
            --max "${{ github.event.inputs.max }}" \
            --weeks "${{ github.event.inputs.weeks }}"

      - name: Install Chromium
        run: |
          npm i playwright ffmpeg-static --no-save
          npx playwright install --with-deps chromium

      - name: Render the video
        run: |
          node scripts/recap/render.mjs \
            --template template-rotation.html \
            --data rotation.json \
            --name rotation

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUFFIX="${{ github.event.inputs.tag }}"
          [ -z "$SUFFIX" ] && SUFFIX="gw${{ steps.data.outputs.gw }}"
          TAG="rotation-$SUFFIX"
          # Reusing a tag replaces the video, so a re-run after a tweak is safe.
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "scripts/recap/out/rotation.mp4" \
            -R "$GITHUB_REPOSITORY" \
            --title "Budget rotation — $SUFFIX" \
            --notes "Auto-generated 1080x1080 video: the exactly-solved cheapest way to cover one squad slot, from the official FPL data. Same audio bed as the gameweek recap. Independent — not affiliated with the Premier League."
