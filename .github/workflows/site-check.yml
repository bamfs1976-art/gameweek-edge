name: Site check

# Grades the DEPLOYED site rather than the source: routes that must serve,
# retired URLs that must redirect rather than 404, the API health route, and
# whether the service worker on the CDN is the new one.
#
# It exists because the sandbox this project is developed in cannot reach
# gameweekedge.co.uk — the egress proxy refuses it — so nobody working here
# could honestly say "I checked the live site". A runner can.
#
# Dispatch, plus a nudge after a push to main: Netlify builds on its own
# schedule, so the scheduled run gives the deploy time to land before asking.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Origin to check (default: the production site)'
        type: string
        default: ''
      referees:
        description: 'Also probe whether referees are published before kick-off'
        type: boolean
        default: false
  schedule:
    - cron: '25 7 * * *' # once a day, after any overnight deploy

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the live site
        run: node dev/site-check.mjs ${{ github.event.inputs.origin }}

      # Same question in a different direction — what the deployed site really
      # serves — so it lives here rather than in a file of its own. Opt-in,
      # because it spends football-data quota and the answer changes only when
      # the upstream plan does. `always()` so a red site check still lets the
      # probe report; the two findings are independent.
      - name: Probe referees
        if: ${{ always() && github.event.inputs.referees == 'true' }}
        run: |
          node dev/probe-referees.mjs ${{ github.event.inputs.origin }} | tee ref.txt
          { echo '```'; cat ref.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      # How the data would be READ, as opposed to whether it is there. Runs
      # under the same input because the two questions are only useful
      # together — "it exists" and "here is what parsing it would cost".
      - name: Probe the EFL source
        if: ${{ always() && github.event.inputs.referees == 'true' }}
        run: |
          node dev/probe-efl-source.mjs | tee efl.txt
          { echo '```'; cat efl.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
